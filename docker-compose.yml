x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-paper}:${POSTGRES_PASSWORD:-paper}@postgres:5432/${POSTGRES_DB:-paper_trading}
  REDIS_URL: redis://redis:6379/0

x-backend-deps: &backend-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper}
      POSTGRES_DB: ${POSTGRES_DB:-paper_trading}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paper} -d ${POSTGRES_DB:-paper_trading}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API owns dev schema management (see app.main._dev_schema_sync); the worker
  # services wait for it to be healthy so they never touch a half-migrated schema.
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on: *backend-deps
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  marketdata:
    build: ./backend
    command: python -m app.workers.marketdata_main
    environment: *backend-env
    env_file: .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  engine:
    build: ./backend
    command: python -m app.services.execution.worker
    environment: *backend-env
    env_file: .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build: ./backend
    command: python -m app.workers.scheduler_main
    environment: *backend-env
    env_file: .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
