<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f8fa; color: #0f172a; -webkit-font-smoothing: antialiased; }
    a { color: #4f46e5; text-decoration: none; } a:hover { color: #4338ca; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #94a3b8; font-weight: 600; padding: 11px 16px; background: #fafbfc; }
    td { padding: 12px 16px; font-size: 13px; border-top: 1px solid #eef0f3; }
  </style>
</helmet>
<div>
  <dc-import name="Nav" active="orders" user="Uday Krishna" hint-size="100%,56px"></dc-import>

  <div style="display: flex; align-items: stretch; min-height: 900px;">
    <div style="width: 300px; flex-shrink: 0;">
      <dc-import name="Rail" hint-size="300px,100%"></dc-import>
    </div>

    <div style="flex: 1; min-width: 0; background: #f7f8fa; padding: 28px 32px 56px;">
      <h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em;">Orders</h1>

      <div style="display: inline-flex; gap: 3px; background: #f1f5f9; border-radius: 9px; padding: 3px; margin-bottom: 18px;">
        <span style="font-size: 13px; font-weight: 600; color: #0f172a; background: #fff; border-radius: 7px; padding: 6px 14px; box-shadow: 0 1px 2px rgba(15,23,42,0.06);">Order book</span>
        <span style="font-size: 13px; font-weight: 500; color: #64748b; padding: 6px 14px;">Trade book</span>
      </div>

      <div style="background: #fff; border: 1px solid #e6e8ec; border-radius: 14px; overflow: hidden;">
        <table>
          <thead>
            <tr>
              <th>Instrument</th><th>Side</th><th style="text-align: right;">Qty</th>
              <th>Type · Product</th><th style="text-align: right;">Price</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
              <tr>
                <td style="font-weight: 600;">{{r.sym}}</td>
                <td style="font-weight: 700; {{r.sideStyle}}">{{r.side}}</td>
                <td class="mono" style="text-align: right;">{{r.qty}}</td>
                <td style="color: #475569;">{{r.tp}}</td>
                <td class="mono" style="text-align: right;">{{r.price}}</td>
                <td>
                  <span style="font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 8px; {{r.chipStyle}}">{{r.status}}</span>
                </td>
                <td style="text-align: right;">
                  <sc-if value="{{r.cancellable}}" hint-placeholder-val="{{true}}">
                    <span style="font-size: 12px; color: #475569; border: 1px solid #e6e8ec; border-radius: 7px; padding: 4px 10px;">Cancel</span>
                  </sc-if>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1500,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const buy = 'color: #16a34a;', sell = 'color: #dc2626;';
    const chips = {
      OPEN: 'background: #fef3c7; color: #b45309;',
      COMPLETE: 'background: #dcfce7; color: #15803d;',
      CANCELLED: 'background: #f1f5f9; color: #64748b;',
      REJECTED: 'background: #fee2e2; color: #b91c1c;',
    };
    const rows = [
      { sym: 'RELIANCE', side: 'BUY', sideStyle: buy, qty: '0 / 10', tp: 'LIMIT · CNC', price: '1,318.00', status: 'OPEN', cancellable: true },
      { sym: 'NIFTY 24000 CE', side: 'SELL', sideStyle: sell, qty: '50 / 50', tp: 'MARKET · NRML', price: 'MKT', status: 'COMPLETE', cancellable: false },
      { sym: 'TCS', side: 'BUY', sideStyle: buy, qty: '5 / 5', tp: 'MARKET · MIS', price: 'MKT', status: 'COMPLETE', cancellable: false },
      { sym: 'HDFCBANK', side: 'SELL', sideStyle: sell, qty: '0 / 12', tp: 'SL · CNC', price: '1,650.00  (t 1,655.00)', status: 'CANCELLED', cancellable: false },
      { sym: 'GOLDM', side: 'BUY', sideStyle: buy, qty: '0 / 100', tp: 'MARKET · MIS', price: 'MKT', status: 'REJECTED', cancellable: false },
    ];
    return { rows: rows.map(r => ({ ...r, chipStyle: chips[r.status] })) };
  }
}
</script>
</body>
</html>
