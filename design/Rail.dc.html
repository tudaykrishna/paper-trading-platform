<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; background: #ffffff; -webkit-font-smoothing: antialiased; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
    a { color: #4f46e5; text-decoration: none; } a:hover { color: #4338ca; }
  </style>
</helmet>
<div style="width: 100%; min-height: 100%; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e6e8ec;">

  <!-- list tabs -->
  <div style="display: flex; align-items: center; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid #eef0f3;">
    <span style="font-size: 12px; font-weight: 600; color: #4f46e5; border-bottom: 2px solid #4f46e5; padding: 8px 10px;">Popular</span>
    <span style="font-size: 12px; font-weight: 500; color: #64748b; padding: 8px 10px;">F&amp;O</span>
    <span style="font-size: 12px; font-weight: 500; color: #64748b; padding: 8px 10px;">Metals</span>
    <span style="margin-left: auto; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; color: #94a3b8; border: 1px solid #e6e8ec; border-radius: 7px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </span>
  </div>

  <!-- search -->
  <div style="padding: 10px 10px 6px;">
    <div style="display: flex; align-items: center; gap: 7px; border: 1px solid #d7dbe0; border-radius: 9px; padding: 7px 10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="font-size: 13px; color: #94a3b8;">Search &amp; add…</span>
    </div>
  </div>

  <!-- filter pills -->
  <div style="display: flex; gap: 5px; padding: 2px 10px 8px; overflow: hidden;">
    <span style="font-size: 11px; font-weight: 600; color: #4f46e5; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 999px; padding: 3px 9px;">All</span>
    <span style="font-size: 11px; font-weight: 500; color: #64748b; background: #fff; border: 1px solid #e6e8ec; border-radius: 999px; padding: 3px 9px;">Stocks</span>
    <span style="font-size: 11px; font-weight: 500; color: #64748b; background: #fff; border: 1px solid #e6e8ec; border-radius: 999px; padding: 3px 9px;">Index</span>
    <span style="font-size: 11px; font-weight: 500; color: #64748b; background: #fff; border: 1px solid #e6e8ec; border-radius: 999px; padding: 3px 9px;">F&amp;O</span>
  </div>

  <!-- list -->
  <div style="flex: 1; border-top: 1px solid #eef0f3;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="20">
      <sc-if value="{{r.hover}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8fafc; border-bottom: 1px solid #f1f5f9;">
          <span style="font-size: 12.5px; font-weight: 600;">{{r.sym}}</span>
          <span style="display: flex; gap: 4px;">
            <span style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: #dcfce7; color: #15803d; font-size: 11px; font-weight: 700;">B</span>
            <span style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: #fee2e2; color: #b91c1c; font-size: 11px; font-weight: 700;">S</span>
            <span style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: #64748b;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            </span>
            <span style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: #94a3b8;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </span>
          </span>
        </div>
      </sc-if>
      <sc-if value="{{r.plain}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #f4f5f7;">
          <span style="font-size: 12.5px; font-weight: 600;">{{r.sym}}</span>
          <span style="text-align: right;">
            <span class="mono" style="font-size: 12px; font-weight: 600;">{{r.ltp}}</span>
            <span class="mono" style="font-size: 10.5px; margin-left: 6px; {{r.chgStyle}}">{{r.chg}}</span>
          </span>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="padding: 8px 12px; border-top: 1px solid #eef0f3; font-size: 11px; color: #94a3b8;">Popular · 20 / 50</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":300,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const up = 'color: #16a34a;', dn = 'color: #dc2626;';
    const raw = [
      ['NIFTY 50', '24,180.55', '+0.29%', up],
      ['NIFTY BANK', '51,342.90', '+0.44%', up],
      ['SENSEX', '79,210.30', '+0.21%', up],
      ['NIFTY IT', '38,905.15', '−0.62%', dn],
      ['RELIANCE', '1,322.40', '+0.86%', up],
      ['HDFCBANK', '1,664.05', '−0.42%', dn],
      ['TCS', '3,918.70', '+1.34%', up],
      ['INFY', '1,548.10', '−0.11%', dn],
      ['ICICIBANK', '1,242.60', '+0.58%', up],
      ['BHARTIARTL', '1,589.25', '+0.12%', up],
      ['SBIN', '812.35', '−0.74%', dn],
      ['ITC', '451.25', '+0.04%', up],
      ['LT', '3,640.80', '+0.93%', up],
      ['KOTAKBANK', '1,795.10', '−0.28%', dn],
      ['AXISBANK', '1,151.45', '+0.66%', up],
      ['BAJFINANCE', '7,204.00', '+1.11%', up],
      ['HINDUNILVR', '2,402.75', '−0.35%', dn],
      ['MARUTI', '12,860.50', '+0.47%', up],
      ['SUNPHARMA', '1,718.90', '+0.22%', up],
      ['TATAMOTORS', '978.15', '−1.05%', dn],
    ];
    return {
      rows: raw.map(([sym, ltp, chg, chgStyle], i) => ({
        sym, ltp, chg, chgStyle,
        hover: i === 4,
        plain: i !== 4,
      })),
    };
  }
}
</script>
</body>
</html>
