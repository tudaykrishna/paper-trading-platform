<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f8fa; color: #0f172a; -webkit-font-smoothing: antialiased; }
    a { color: #4f46e5; text-decoration: none; } a:hover { color: #4338ca; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; width: 100%; }
    th { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #94a3b8; font-weight: 600; padding: 10px 16px; background: #fafbfc; }
    td { padding: 9px 16px; font-size: 13px; border-top: 1px solid #eef0f3; }
  </style>
</helmet>
<div>
  <dc-import name="Nav" active="options" user="Uday Krishna" hint-size="100%,56px"></dc-import>

  <div style="display: flex; align-items: stretch; min-height: 900px;">
    <div style="width: 300px; flex-shrink: 0;">
      <dc-import name="Rail" hint-size="300px,100%"></dc-import>
    </div>

    <div style="flex: 1; min-width: 0; background: #f7f8fa; padding: 28px 32px 56px;">
      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 18px;">
        <h1 style="margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em;">Option chain</h1>
        <div style="border: 1px solid #d7dbe0; border-radius: 8px; padding: 7px 12px; display: flex; align-items: center; gap: 8px; background: #fff; font-size: 13px; font-weight: 600;">
          NIFTY
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <span style="font-size: 13px; color: #94a3b8;">Expiry <span style="color: #475569; font-weight: 500;">25 Sep 2026</span></span>
        <span style="font-size: 13px; color: #94a3b8;">Spot <span class="mono" style="color: #0f172a; font-weight: 600;">24,180.55</span></span>
      </div>

      <div style="background: #fff; border: 1px solid #e6e8ec; border-radius: 14px; overflow: hidden;">
        <table>
          <thead>
            <tr>
              <th style="text-align: right;">Call OI</th>
              <th style="text-align: right;">Call LTP</th>
              <th style="text-align: center; background: #f1f5f9;">Strike</th>
              <th style="text-align: left;">Put LTP</th>
              <th style="text-align: left;">Put OI</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
              <tr style="{{r.rowStyle}}">
                <td class="mono" style="text-align: right; color: #94a3b8;">{{r.coi}}</td>
                <td style="text-align: right;"><span class="mono" style="color: #16a34a; font-weight: 600;">{{r.cltp}}</span></td>
                <td class="mono" style="text-align: center; font-weight: 700; background: #f8fafc;">{{r.strike}}</td>
                <td style="text-align: left;"><span class="mono" style="color: #dc2626; font-weight: 600;">{{r.pltp}}</span></td>
                <td class="mono" style="text-align: left; color: #94a3b8;">{{r.poi}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <p style="font-size: 12px; color: #94a3b8; margin: 10px 2px 0;">Tap any LTP to open the order pad for that contract. The at-the-money row is highlighted.</p>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1500,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const atm = 'background: #eef2ff;';
    const rows = [
      { strike: '23,900', coi: '18.4K', cltp: '312.75', pltp: '41.20', poi: '9.1K', rowStyle: '' },
      { strike: '24,000', coi: '24.7K', cltp: '238.10', pltp: '63.45', poi: '15.3K', rowStyle: '' },
      { strike: '24,100', coi: '31.2K', cltp: '176.90', pltp: '96.75', poi: '21.0K', rowStyle: '' },
      { strike: '24,200', coi: '28.9K', cltp: '124.35', pltp: '142.60', poi: '26.6K', rowStyle: atm },
      { strike: '24,300', coi: '22.1K', cltp: '82.05', pltp: '201.90', poi: '19.4K', rowStyle: '' },
      { strike: '24,400', coi: '16.8K', cltp: '51.70', pltp: '272.15', poi: '12.7K', rowStyle: '' },
      { strike: '24,500', coi: '13.2K', cltp: '31.45', pltp: '351.00', poi: '8.9K', rowStyle: '' },
    ];
    return { rows };
  }
}
</script>
</body>
</html>
