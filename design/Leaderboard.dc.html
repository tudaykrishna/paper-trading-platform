<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f8fa; color: #0f172a; -webkit-font-smoothing: antialiased; }
    a { color: #4f46e5; text-decoration: none; } a:hover { color: #4338ca; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #94a3b8; font-weight: 600; padding: 11px 16px; background: #fafbfc; }
    td { padding: 13px 16px; font-size: 13px; border-top: 1px solid #eef0f3; }
  </style>
</helmet>
<div>
  <dc-import name="Nav" active="leaderboard" user="Uday Krishna" hint-size="100%,56px"></dc-import>

  <div style="display: flex; align-items: stretch; min-height: 900px;">
    <div style="width: 300px; flex-shrink: 0;">
      <dc-import name="Rail" hint-size="300px,100%"></dc-import>
    </div>

    <div style="flex: 1; min-width: 0; background: #f7f8fa; padding: 28px 32px 56px;">
      <h1 style="margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em;">Leaderboard</h1>
      <p style="margin: 0 0 20px; font-size: 13px; color: #94a3b8;">Ranked by net worth vs the ₹10,00,000 opening balance.</p>

      <div style="background: #fff; border: 1px solid #e6e8ec; border-radius: 14px; overflow: hidden;">
        <table>
          <thead>
            <tr>
              <th style="width: 56px;">#</th><th>Trader</th>
              <th style="text-align: right;">Net worth</th><th style="text-align: right;">P&amp;L</th><th style="text-align: right;">Return</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
              <tr style="{{r.rowStyle}}">
                <td class="mono" style="color: #94a3b8; font-weight: 600;">{{r.rank}}</td>
                <td style="font-weight: 600;">
                  {{r.name}}
                  <sc-if value="{{r.you}}" hint-placeholder-val="{{false}}">
                    <span style="font-size: 11px; font-weight: 600; color: #4f46e5; background: #eef2ff; border-radius: 5px; padding: 1px 6px; margin-left: 6px;">you</span>
                  </sc-if>
                </td>
                <td class="mono" style="text-align: right;">{{r.worth}}</td>
                <td class="mono" style="text-align: right; {{r.pnlStyle}}">{{r.pnl}}</td>
                <td class="mono" style="text-align: right; {{r.pnlStyle}}">{{r.ret}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1500,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const up = 'color: #16a34a;', dn = 'color: #dc2626;';
    const rows = [
      { rank: '1', name: 'Aarav Mehta', worth: '₹12,84,300', pnl: '+₹2,84,300', ret: '+28.43%', pnlStyle: up, you: false, rowStyle: '' },
      { rank: '2', name: 'Priya Nair', worth: '₹11,92,050', pnl: '+₹1,92,050', ret: '+19.21%', pnlStyle: up, you: false, rowStyle: '' },
      { rank: '3', name: 'Uday Krishna', worth: '₹11,05,733', pnl: '+₹1,05,733', ret: '+10.57%', pnlStyle: up, you: true, rowStyle: 'background: #f5f3ff;' },
      { rank: '4', name: 'Rohan Gupta', worth: '₹10,41,900', pnl: '+₹41,900', ret: '+4.19%', pnlStyle: up, you: false, rowStyle: '' },
      { rank: '5', name: 'Sneha Rao', worth: '₹9,88,240', pnl: '−₹11,760', ret: '−1.18%', pnlStyle: dn, you: false, rowStyle: '' },
      { rank: '6', name: 'Karan Shah', worth: '₹9,42,110', pnl: '−₹57,890', ret: '−5.79%', pnlStyle: dn, you: false, rowStyle: '' },
      { rank: '7', name: 'Isha Verma', worth: '₹8,76,500', pnl: '−₹1,23,500', ret: '−12.35%', pnlStyle: dn, you: false, rowStyle: '' },
    ];
    return { rows };
  }
}
</script>
</body>
</html>
